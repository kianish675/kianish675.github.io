<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Setup</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.bg{
position:fixed;
width:120%;
height:120%;
background:url("https://images.unsplash.com/photo-1502082553048-f009c37129b9") center/cover no-repeat;
z-index:-2;
transition:transform 0.2s;
}

#visualizer{
position:fixed;
bottom:0;
left:0;
width:100%;
height:200px;
z-index:-1;
opacity:0.5;
}

.container{
display:flex;
flex-direction:column;
gap:15px;
}

.card{
display:flex;
gap:30px;
padding:20px;
border-radius:18px;
backdrop-filter:blur(12px);
background:rgba(0,0,0,0.4);
}

.profile{
flex-direction:column;
text-align:center;
}

.profile h2{
margin:0;
}

.profile p{
margin:3px 0;
}

.specs ul{
list-style:none;
padding:0;
margin:5px 0;
}

.specs li{
margin:5px 0;
}

.phone img{
width:180px;
border-radius:12px;
}

.player{
flex-direction:column;
align-items:center;
gap:10px;
}

.album img{
width:120px;
border-radius:50%;
animation:spin 8s linear infinite;
animation-play-state:paused;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

.controls button{
padding:8px 12px;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.2);
color:white;
cursor:pointer;
}

input[type="range"]{
width:150px;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<canvas id="visualizer"></canvas>

<div class="container">

<div class="card profile">
<h2>Kianishh</h2>
<p>Developer • Artist</p>
<p>Hobbies: Gaming, Coding</p>
</div>

<div class="card">

<div class="specs">
<h3>My PC Specs</h3>

<ul>
<li>CPU: Ryzen 7 7435HS</li>
<li>GPU: RTX 3050</li>
<li>RAM: 16GB</li>
<li>Storage: 512GB NvME</li>
<li>OS: Windows 11</li>
</ul>
</div>

<div class="phone">
<img src="images/a26x.png">
</div>

</div>

<div class="card player">

<div class="album">
<img id="cover" src="images/cover.png">
</div>

<audio id="music" src="./audio/song.mp3" controls></audio>

<div class="controls">
<button onclick="togglePlay()">⏯</button>
</div>

<label>Volume</label>
<input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">

</div>

</div>

<script>
const bg=document.getElementById("bg");

document.addEventListener("mousemove",e=>{
let x=(e.clientX/window.innerWidth-0.5)*20;
let y=(e.clientY/window.innerHeight-0.5)*20;
bg.style.transform=`translate(${x}px,${y}px)`;
});

const player=document.getElementById("music");
const cover=document.getElementById("cover");
const volume=document.getElementById("volume");

function togglePlay(){
if(player.paused){
player.play().catch(err => console.log(err));
cover.style.animationPlayState="running";
}else{
player.pause();
cover.style.animationPlayState="paused";
}
}

volume.addEventListener("input",()=>{
player.volume=volume.value;
});

const canvas=document.getElementById("visualizer");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=200;

const audioCtx=new AudioContext();
const source=audioCtx.createMediaElementSource(player);
const analyser=audioCtx.createAnalyser();

source.connect(analyser);
analyser.connect(audioCtx.destination);

analyser.fftSize=256;

const bufferLength=analyser.frequencyBinCount;
const dataArray=new Uint8Array(bufferLength);

function draw(){
requestAnimationFrame(draw);
analyser.getByteFrequencyData(dataArray);
ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<bufferLength;i++){
let barHeight=dataArray[i];
ctx.fillStyle="white";
ctx.fillRect(i*5,canvas.height-barHeight/2,3,barHeight);
}
}

draw();
</script>

</body>
</html>

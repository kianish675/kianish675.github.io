<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>mxlano</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Segoe UI,Arial;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
background:black;
animation:fadeIn 1.4s ease;
}

@keyframes fadeIn{
from{
filter:blur(20px);
opacity:0;
}
to{
filter:blur(0px);
opacity:1;
}
}

.bg{
position:fixed;
width:120%;
height:120%;
background:url("https://images.unsplash.com/photo-1502082553048-f009c37129b9") center/cover no-repeat;
z-index:-3;
transition:transform .25s ease;
}

.glow{
position:fixed;
width:600px;
height:600px;
background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%);
filter:blur(120px);
z-index:-2;
pointer-events:none;
}

#visualizer{
position:fixed;
bottom:0;
left:0;
width:100%;
height:200px;
z-index:-1;
opacity:.35;
}

.container{
display:flex;
flex-direction:column;
gap:18px;
backdrop-filter:blur(6px);
}

.card{
display:flex;
gap:30px;
padding:24px;
border-radius:22px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
backdrop-filter:blur(18px) saturate(180%);
box-shadow:
0 8px 30px rgba(0,0,0,.6),
inset 0 0 20px rgba(255,255,255,.08);
transition:.35s ease;
transform-style:preserve-3d;
}

.card:hover{
transform:scale(1.02);
box-shadow:
0 20px 60px rgba(0,0,0,.7),
inset 0 0 25px rgba(255,255,255,.1);
}

.profile{
flex-direction:column;
text-align:center;
}

.profile h2{
margin:0;
font-size:26px;
letter-spacing:.5px;
}

.profile p{
margin:4px 0;
opacity:.85;
}

.specs ul{
list-style:none;
padding:0;
margin:8px 0;
}

.specs li{
margin:6px 0;
opacity:.9;
}

.phone img{
width:180px;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.player{
flex-direction:column;
align-items:center;
gap:12px;
}

.album img{
width:120px;
border-radius:50%;
animation:spin 8s linear infinite;
animation-play-state:paused;
box-shadow:
0 0 20px rgba(255,255,255,.3),
0 0 60px rgba(255,255,255,.2);
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

.controls button{
padding:10px 16px;
border:none;
border-radius:14px;
background:rgba(255,255,255,.15);
color:white;
font-size:16px;
cursor:pointer;
transition:.2s;
}

.controls button:hover{
background:rgba(255,255,255,.25);
transform:scale(1.05);
}

input[type="range"]{
width:160px;
}

</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div class="glow" id="glow"></div>

<canvas id="visualizer"></canvas>

<div class="container">

<div class="card profile">
<h2>milanomaq</h2>
<p>Developer • Artist</p>
<p>Hobbies: Gaming, Coding</p>
</div>

<div class="card">

<div class="specs">
<h3>My PC Specs</h3>
<ul>
<li>CPU: Ryzen 7 7435HS</li>
<li>GPU: RTX 3050</li>
<li>RAM: 16GB</li>
<li>Storage: 512GB NVMe</li>
<li>OS: Windows 11</li>
</ul>
</div>

<div class="phone">
<img src="images/a26x.png">
</div>

</div>

<div class="card player">

<div class="album">
<img id="cover" src="images/cover.png">
</div>

<audio id="music" src="./audio/song.mp3"></audio>

<div class="controls">
<button onclick="togglePlay()">⏯</button>
</div>

<label>Volume</label>
<input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">

</div>

</div>

<script>

const bg=document.getElementById("bg");
const glow=document.getElementById("glow");

document.addEventListener("mousemove",e=>{

let x=(e.clientX/window.innerWidth-0.5)*30;
let y=(e.clientY/window.innerHeight-0.5)*30;

bg.style.transform=`translate(${x}px,${y}px)`;

glow.style.left=e.clientX-300+"px";
glow.style.top=e.clientY-300+"px";

});

const player=document.getElementById("music");
const cover=document.getElementById("cover");
const volume=document.getElementById("volume");

player.volume=volume.value;

volume.addEventListener("input",()=>{
player.volume=volume.value;
});

const canvas=document.getElementById("visualizer");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=200;

let audioCtx;
let analyser;
let source;
let dataArray;
let bufferLength;
let started=false;

function startAudio(){

audioCtx=new (window.AudioContext||window.webkitAudioContext)();

source=audioCtx.createMediaElementSource(player);
analyser=audioCtx.createAnalyser();

source.connect(analyser);
analyser.connect(audioCtx.destination);

analyser.fftSize=256;

bufferLength=analyser.frequencyBinCount;
dataArray=new Uint8Array(bufferLength);

draw();

}

function togglePlay(){

if(!started){
startAudio();
started=true;
}

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

if(player.paused){
player.play();
cover.style.animationPlayState="running";
}else{
player.pause();
cover.style.animationPlayState="paused";
}

}

function draw(){

requestAnimationFrame(draw);

analyser.getByteFrequencyData(dataArray);

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<bufferLength;i++){

let h=dataArray[i];

ctx.fillStyle="rgba(255,255,255,0.7)";
ctx.fillRect(i*6,canvas.height-h/2,4,h);

}

}

</script>

</body>
</html>
